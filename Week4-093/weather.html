<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Forecast Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #2196f3,#1be2d8);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    transition: background-image 0.5s;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: -1;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1, .forecast-title {
    text-align: center;
    color: white;
}

.search {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

select, button {
    padding: 12px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
}

select {
    flex: 1;
}

button {
    background: #222;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1be2d8;
}

#message {
    text-align: center;
    color: white;
}

.current, .card {
    background: rgba(255,255,255,0.9);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.current {
    margin-bottom: 20px;
}

.temp {
    font-size: 50px;
    font-weight: bold;
    color: #2196f3;
}

.details {
    display: flex;
    justify-content: center;
    gap: 50px;
}

.forecast {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

.card .temp {
    font-size: 24px;
}

.hidden {
    display: none;
}

@media (max-width: 700px) {
    .search {
        flex-direction: column;
    }

    .forecast {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🌤️ Weather Forecast Dashboard</h1>

<div class="search">

<select id="city">
    <option value="">Select City</option>
    <option>Hyderabad</option>
    <option>Bengaluru</option>
    <option>Chennai</option>
    <option>Mumbai</option>
    <option>Delhi</option>
    <option>Kolkata</option>
    <option>Pune</option>
    <option>Vijayawada</option>
    <option>Visakhapatnam</option>
    <option>Tirupati</option>
</select>

<button onclick="getWeather()">Get Weather</button>

</div>

<p id="message"></p>

<div id="weather" class="hidden">

<div class="current">

<h2 id="location"></h2>

<div class="temp">
<span id="temperature"></span>°C
</div>

<p id="description"></p>

<div class="details">

<div>
💧 Humidity<br>
<b id="humidity"></b>%
</div>

<div>
💨 Wind<br>
<b id="wind"></b> km/h
</div>

</div>

</div>

<h2 class="forecast-title">5-Day Forecast</h2>

<div id="forecast" class="forecast"></div>

</div>

</div>

async function getWeather() {

const city = document.getElementById("city").value;
const message = document.getElementById("message");
const weather = document.getElementById("weather");

if (!city) {
    message.textContent = "Please select a city.";
    weather.classList.add("hidden");
    return;
}

/* Change background */

document.body.style.backgroundImage =
    `url("${images[city]}")`;

message.textContent = "Loading...";
weather.classList.add("hidden");

try {

const geo = await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&format=json`
);

const g = await geo.json();

if (!g.results)
    throw new Error();

const location = g.results[0];

const response = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`
);

const data = await response.json();

document.getElementById("location").textContent =
`${location.name}, ${location.country}`;

document.getElementById("temperature").textContent =
Math.round(data.current.temperature_2m);

document.getElementById("description").textContent =
desc(data.current.weather_code);

document.getElementById("humidity").textContent =
data.current.relative_humidity_2m;

document.getElementById("wind").textContent =
data.current.wind_speed_10m;


/* Forecast */

const forecast = document.getElementById("forecast");

forecast.innerHTML = "";

data.daily.time.forEach((date, i) => {

const day = new Date(date).toLocaleDateString(
"en-US",
{ weekday: "short" }
);

forecast.innerHTML += `

<div class="card">

<h3>${day}</h3>

<p>${desc(data.daily.weather_code[i])}</p>

<p class="temp">
${Math.round(data.daily.temperature_2m_max[i])}°C
</p>

<p>
Min:
${Math.round(data.daily.temperature_2m_min[i])}°C
</p>

</div>

`;

});

message.textContent = "";
weather.classList.remove("hidden");

}

catch {

message.textContent = "Unable to get weather data.";

}

}


/* Weather descriptions */

function desc(code) {

const weather = {

0: "☀️ Clear Sky",
1: "🌤️ Mainly Clear",
2: "⛅ Partly Cloudy",
3: "☁️ Overcast",
45: "🌫️ Fog",
48: "🌫️ Fog",
51: "🌦️ Light Drizzle",
53: "🌦️ Drizzle",
55: "🌧️ Dense Drizzle",
61: "🌧️ Light Rain",
63: "🌧️ Rain",
65: "🌧️ Heavy Rain",
71: "🌨️ Light Snow",
73: "❄️ Snow",
75: "❄️ Heavy Snow",
80: "🌦️ Rain Showers",
81: "🌦️ Rain Showers",
82: "🌧️ Heavy Showers",
95: "⛈️ Thunderstorm"

};

return weather[code] || "Unknown Weather";

}
