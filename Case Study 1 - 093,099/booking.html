<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Ticket - CineWorld</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav>
      <b>🎬 CineWorld</b>
      <div>
        <a href="index.html">Home</a>
        <a href="booking.html">Book Ticket</a>
        <a href="resale.html">Resale</a>
      </div>
    </nav>

    <div class="booking">
      <h1>🎟️ Book Ticket</h1>

      <label>Movie</label>
      <select id="movie" class="form-control">
        <option value="">Select Movie</option>
        <option value="200">Irumudi - ₹200</option>
        <option value="220">Spider-Man: Brand New Day - ₹220</option>
        <option value="180">Toxic - ₹180</option>
        <option value="200">I'm Game - ₹200</option>
      </select>

      <label>Show Time</label>
      <div class="times">
        <button type="button" onclick="time(this,'10:00 AM')">10:00 AM</button>
        <button type="button" onclick="time(this,'1:00 PM')">1:00 PM</button>
        <button type="button" onclick="time(this,'4:00 PM')">4:00 PM</button>
        <button type="button" onclick="time(this,'7:00 PM')">7:00 PM</button>
      </div>

      <p id="show">No time selected</p>

      <label for="date">Date</label>
      <input id="date" class="form-control" type="date" />

      <div class="screen">🎥 SCREEN</div>

      <h5>Select Seats</h5>
      <div id="seats" class="seats"></div>

      <p>Selected: <b id="selected">None</b></p>
      <h4>Total: <span id="total">₹0</span></h4>
      <small id="totalHint" class="total-hint">
        Choose a movie and seat to calculate the total.
      </small>

      <input id="name" class="form-control" placeholder="Name" />
      <input id="email" class="form-control" placeholder="Email" />
      <input
        id="phone"
        class="form-control"
        placeholder="10-digit Mobile Number"
        maxlength="10"
      />

      <button class="confirm" type="button" onclick="book()">
        Confirm Booking 🎟️
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
