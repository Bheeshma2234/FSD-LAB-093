<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resale - CineWorld</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav>
      <b>🎬 CineWorld</b>
      <div>
        <a href="index.html">Home</a>
        <a href="booking.html">Book Ticket</a>
        <a href="resale.html">Resale</a>
      </div>
    </nav>

    <section class="resale">
      <h1>🔄 Ticket Exchange</h1>
      <p>Sell your ticket if you cannot attend the show.</p>

      <div class="resale-form">
        <input id="seller" placeholder="Your Name" />

        <select id="rMovie">
          <option value="">Select Movie</option>
          <option>Irumudi</option>
          <option>Spider-Man: Brand New Day</option>
          <option>Toxic</option>
          <option>I'm Game</option>
        </select>

        <select id="rTime">
          <option value="">Select Show Time</option>
          <option>10:00 AM</option>
          <option>1:00 PM</option>
          <option>4:00 PM</option>
          <option>7:00 PM</option>
        </select>

        <input id="rSeat" placeholder="Seat (A1)" />
        <input id="rPrice" type="number" placeholder="Price" />

        <button type="button" onclick="sell()">List Ticket 🎟️</button>
      </div>

      <h2>🎫 Available Tickets</h2>
      <div id="tickets"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
