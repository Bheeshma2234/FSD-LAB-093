
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CineWorld - Movie Tickets</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <b>🎬 CineWorld</b>
    <div>
        <a href="index.html">Home</a>
        <a href="booking.html">Book Ticket</a>
        <a href="resale.html">Resale</a>
        <a href="account.html">My Bookings</a>
        <a href="login.html">Login</a>
    </div>
</nav>

<section class="hero">
    <h1>Welcome to CineWorld 🍿</h1>
    <p>Your movie. Your seat. Your moment.</p>
    <a href="booking.html" class="main-btn">Book Now 🎟️</a>
</section>

<section class="container">
    <h2>🔥 Now Showing</h2>
    <div id="nowShowing" class="row g-4">
        <p>Loading movies...</p>
    </div>
</section>

<section class="container">
    <h2>🔜 Coming Soon</h2>
    <div id="comingSoon" class="row g-4">
        <p>Loading upcoming movies...</p>
    </div>
</section>

<footer>🎬 CineWorld | © 2026</footer>

<script>
async function loadMovies() {
    const nowShowing = document.getElementById("nowShowing");
    const comingSoon = document.getElementById("comingSoon");

    try {
        const response = await fetch("/api/movies");

        if (!response.ok) {
            throw new Error("Could not retrieve movies.");
        }

        const data = await response.json();
        const movies = data.movies || [];

        nowShowing.innerHTML = "";
        comingSoon.innerHTML = "";

        function createMovieCard(movie, isUpcoming) {
            const column = document.createElement("div");
            column.className = "col-6 col-md-4 col-lg-3";

            const card = document.createElement("div");
            card.className = "poster";

            const image = document.createElement("img");
            image.src = movie.image
                ? "/" + movie.image.replace(/^\/+/, "")
                : "";
            image.alt = movie.title;
            image.loading = "lazy";

            image.onerror = () => {
                image.style.display = "none";
            };

            const title = document.createElement("h4");
            title.textContent = movie.title;

            const price = document.createElement("p");
            price.textContent = "Ticket price: ₹" + movie.price;

            card.appendChild(image);
            card.appendChild(title);
            card.appendChild(price);

            if (isUpcoming) {
                const status = document.createElement("span");
                status.textContent = "Coming Soon";
                card.appendChild(status);
            } else {
                const link = document.createElement("a");
                link.href = "booking.html";
                link.className = "main-btn";
                link.textContent = "Book Now 🎟️";
                card.appendChild(link);
            }

            column.appendChild(card);
            return column;
        }

        movies.forEach(movie => {
            if (movie.status === "now-showing") {
                nowShowing.appendChild(createMovieCard(movie, false));
            } else if (movie.status === "coming-soon") {
                comingSoon.appendChild(createMovieCard(movie, true));
            }
        });

        if (nowShowing.children.length === 0) {
            nowShowing.textContent = "No movies currently showing.";
        }

        if (comingSoon.children.length === 0) {
            comingSoon.textContent = "No upcoming movies available.";
        }
    } catch (error) {
        nowShowing.textContent =
            "Unable to load movies. Please refresh the page.";
        comingSoon.textContent =
            "Unable to load upcoming movies.";
        console.error("CineWorld movie loading error:", error);
    }
}

loadMovies();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
