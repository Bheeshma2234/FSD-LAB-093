<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - CineWorld</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="style.css"></head><body><nav><b>🎬 CineWorld</b><div><a href="index.html">Home</a><a href="booking.html">Book Ticket</a><a href="login.html">Login</a></div></nav><main class="booking"><h1>✨ Create Account</h1><form id="registerForm"><label>Name</label><input id="name" class="form-control" required minlength="2" autocomplete="name"><label>Email</label><input id="email" class="form-control" type="email" required autocomplete="email"><label>Mobile (optional)</label><input id="phone" class="form-control" maxlength="10" inputmode="numeric" pattern="[0-9]{10}"><label>Password (at least 8 characters)</label><input id="password" class="form-control" type="password" required minlength="8" autocomplete="new-password"><button class="confirm">Register</button></form><p id="message" role="status"></p><p>Already registered? <a href="login.html">Login</a></p></main><script src="auth.js"></script></body></html>
