<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <h2>JavaScript Quiz</h2>
        <div id="timer">Time: 30</div>
        <h3 id="question"></h3>
        <div id="options"></div>
        <button onclick="nextQuestion()">Next</button>
        <h3 id="result"></h3>
    </div>
    <script src="script.js"></script>
</body>
</html>
